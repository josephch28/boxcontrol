<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Manrope, sans-serif">
  <defs>
    <linearGradient id="leftBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101014"/>
      <stop offset="1" stop-color="#0B0B0D"/>
    </linearGradient>
    <pattern id="stripes" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="60" stroke="#E8B84A" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Ground -->
  <rect width="1440" height="900" fill="#0B0B0D"/>

  <!-- Left panel -->
  <rect x="0" y="0" width="720" height="900" fill="url(#leftBg)"/>
  <rect x="0" y="0" width="720" height="900" fill="url(#stripes)"/>
  <line x1="720" y1="0" x2="720" y2="900" stroke="#2A2A31" stroke-width="1"/>

  <!-- Left corner mark -->
  <g transform="translate(56, 56)">
    <path d="M12 8 L28 8 L32 14 L32 26 L28 32 L20 34 L12 32 L8 26 L8 16 Z" fill="none" stroke="#E8B84A" stroke-width="1.5"/>
    <circle cx="14" cy="18" r="1.5" fill="#E8B84A"/>
    <circle cx="26" cy="18" r="1.5" fill="#E8B84A"/>
    <text x="50" y="14" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2.5" fill="#F5EFE0" font-weight="500">GUANTE DORADO</text>
    <text x="50" y="28" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2.5" fill="#82828A">CLUB DE BOXEO · EST. 2019</text>
  </g>

  <!-- Left hero -->
  <g transform="translate(56, 340)">
    <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="4" fill="#E8B84A">— PANEL ADMINISTRATIVO</text>
    <text x="0" y="130" font-family="Bebas Neue, Impact, sans-serif" font-size="128" letter-spacing="6" fill="#F5EFE0">PELEA</text>
    <text x="0" y="240" font-family="Bebas Neue, Impact, sans-serif" font-size="128" letter-spacing="6" fill="#E8B84A">SIN PAPEL.</text>
    <line x1="0" y1="290" x2="2" y2="380" stroke="#A6822D" stroke-width="2"/>
    <text x="16" y="310" font-family="Manrope, sans-serif" font-size="15" fill="#82828A" font-weight="300">Deja el cuaderno y controla socios,</text>
    <text x="16" y="332" font-family="Manrope, sans-serif" font-size="15" fill="#82828A" font-weight="300">cobros y cierres en un solo lugar.</text>
    <text x="16" y="354" font-family="Manrope, sans-serif" font-size="15" fill="#82828A" font-weight="300">Cada sucursal, cada ingreso, cada peso.</text>
  </g>

  <!-- Left footer stats -->
  <g transform="translate(56, 800)">
    <text x="0" y="0" font-family="Bebas Neue, Impact, sans-serif" font-size="44" letter-spacing="2" fill="#E8B84A">2</text>
    <text x="0" y="24" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="#82828A">SUCURSALES ACTIVAS</text>
    <text x="0" y="40" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="#82828A">NORTE · SUR</text>

    <text x="608" y="0" font-family="Bebas Neue, Impact, sans-serif" font-size="44" letter-spacing="2" fill="#E8B84A" text-anchor="end">142</text>
    <text x="608" y="24" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="#82828A" text-anchor="end">SOCIOS</text>
    <text x="608" y="40" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="#82828A" text-anchor="end">REGISTRADOS HOY</text>
  </g>

  <!-- Right form panel -->
  <g transform="translate(808, 200)">
    <!-- Badge -->
    <line x1="0" y1="6" x2="24" y2="6" stroke="#E8B84A" stroke-width="1"/>
    <text x="34" y="10" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="3" fill="#82828A">ACCESO SEGURO / JWT</text>

    <!-- Heading -->
    <text x="0" y="80" font-family="Bebas Neue, Impact, sans-serif" font-size="52" letter-spacing="2" fill="#F5EFE0">BIENVENIDO</text>
    <text x="0" y="128" font-family="Bebas Neue, Impact, sans-serif" font-size="52" letter-spacing="2" fill="#F5EFE0">DE VUELTA</text>
    <text x="0" y="164" font-family="Manrope, sans-serif" font-size="14" fill="#82828A">Ingresa con tu cuenta corporativa. Recuerda que</text>
    <text x="0" y="184" font-family="Manrope, sans-serif" font-size="14" fill="#82828A">cada sucursal usa su propio código de acceso.</text>

    <!-- Email field -->
    <text x="0" y="240" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2.5" fill="#82828A">CORREO ELECTRÓNICO</text>
    <text x="26" y="270" font-family="Manrope, sans-serif" font-size="16" fill="#F5EFE0" font-weight="500">jchachalo@guantedorado.ec</text>
    <line x1="0" y1="284" x2="480" y2="284" stroke="#3A3A42" stroke-width="1"/>
    <rect x="0" y="254" width="16" height="16" fill="none" stroke="#82828A" stroke-width="1.5" transform="translate(0, 0)"/>

    <!-- Password field -->
    <text x="0" y="324" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2.5" fill="#82828A">CONTRASEÑA</text>
    <text x="26" y="354" font-family="Manrope, sans-serif" font-size="18" fill="#F5EFE0" letter-spacing="6">••••••••••••</text>
    <line x1="0" y1="368" x2="480" y2="368" stroke="#3A3A42" stroke-width="1"/>

    <!-- Submit button -->
    <rect x="0" y="410" width="308" height="60" fill="#E8B84A"/>
    <rect x="0" y="410" width="308" height="60" fill="none" stroke="#A6822D" stroke-width="1"/>
    <text x="26" y="447" font-family="Bebas Neue, Impact, sans-serif" font-size="20" letter-spacing="3" fill="#1A1206" font-weight="700">INGRESAR AL RING</text>
    <path d="M258 440 L278 440 M273 435 L278 440 L273 445" stroke="#1A1206" stroke-width="2" fill="none"/>

    <text x="330" y="447" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="#82828A">¿OLVIDASTE TU CLAVE?</text>

    <!-- Footer note -->
    <line x1="0" y1="530" x2="480" y2="530" stroke="#2A2A31" stroke-width="1"/>
    <text x="0" y="558" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1.5" fill="#82828A">© 2026 GUANTE DORADO</text>
    <text x="480" y="558" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1.5" fill="#82828A" text-anchor="end">SOPORTE · <tspan fill="#E8B84A">EXT. 208</tspan></text>
  </g>
</svg>
